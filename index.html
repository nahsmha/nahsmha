<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نحسمها | قارن سيارتك</title>
<style>
:root{--red:#e50914;--black:#080808;--dark:#111;--muted:#9ca3af;--card:#171717}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#080808;color:#fff}
nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 7%;border-bottom:1px solid #252525;background:#080808;position:sticky;top:0;z-index:3}
.logo{font-size:27px;font-weight:900}.logo span{color:var(--red)}
nav a{color:#ddd;text-decoration:none;margin-right:24px;font-size:14px}
.hero{padding:78px 20px 55px;text-align:center;background:radial-gradient(circle at center,#30070a 0,#120202 35%,#080808 70%)}
.badge{display:inline-block;border:1px solid #5b171b;color:#ff5a61;border-radius:999px;padding:8px 14px;margin-bottom:18px;font-size:13px}
h1{font-size:52px;margin:0 0 14px}.hero h1 span{color:var(--red)}.hero p{color:#c7c7c7;font-size:18px;margin:0 auto 30px;max-width:650px}
.cta{background:var(--red);border:0;color:#fff;border-radius:12px;padding:15px 28px;font-size:17px;font-weight:bold;cursor:pointer}
main{max-width:1050px;margin:auto;padding:28px 18px 70px}
.card{background:var(--card);border:1px solid #292929;border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 12px 30px #0008}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-weight:bold;margin-bottom:8px}select{width:100%;padding:14px;border-radius:12px;background:#0d0d0d;color:white;border:1px solid #383838;font-size:16px}
button.full{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--red);color:white;font-size:16px;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:14px;border-bottom:1px solid #2b2b2b;text-align:center}th{color:#aaa}.win{color:#ff5159;font-weight:900}
.result{border:1px solid #5b171b;background:#210708;padding:18px;border-radius:15px;margin-top:18px}
.score{font-size:30px;text-align:center;font-weight:900}.small{color:#999;font-size:13px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.feature{padding:18px;background:#121212;border:1px solid #292929;border-radius:15px}.feature b{display:block;margin-bottom:7px}.feature p{margin:0;color:#aaa;font-size:14px;line-height:1.6}
footer{text-align:center;color:#777;padding:25px;border-top:1px solid #222}
@media(max-width:650px){nav{padding:0 18px}nav a{display:none}h1{font-size:38px}.grid,.features{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="logo">نحسم<span>ها</span> 🔥</div><div><a href="#compare">المقارنة</a><a href="#how">كيف نعمل؟</a></div></nav>

<section class="hero">
<div class="badge">مقارنة سيارات • قرار أوضح</div>
<h1>محتار بين سيارتين؟<br><span>نحسمها لك.</span></h1>
<p>قارن المواصفات، اعرف نقاط القوة والاختلاف، وخذ ترشيحًا مبنيًا على احتياجك.</p>
<a href="#compare"><button class="cta">ابدأ المقارنة 🚘</button></a>
</section>

<main>
<section class="card" id="compare">
<h2>⚡ قارن سيارتين</h2>
<p class="small">اختر سيارتين من القائمة الشاملة للبدء في المقارنة.</p>
<div class="grid">
<div><label>السيارة الأولى</label><select id="a"></select></div>
<div><label>السيارة الثانية</label><select id="b"></select></div>
</div>
<button class="full" onclick="compare()">احسمها 🔥</button>
<div id="result"></div>
</section>

<section class="card" id="how">
<h2>🎯 وش يناسبك أكثر؟</h2>
<div class="grid">
<div><label>استخدامك</label><select id="use">
<option value="daily">يومي داخل المدينة</option><option value="family">عائلة ومساحة</option>
<option value="travel">سفر وخطوط</option><option value="economy">اقتصادية</option><option value="power">أداء وقوة</option>
</select></div>
<div><label>ميزانيتك</label><select id="budget">
<option>أقل من 80 ألف</option><option>80 - 120 ألف</option><option>120 - 160 ألف</option><option>أكثر من 160 ألف</option>
</select></div>
</div>
<button class="full" onclick="recommend()">وش الأنسب لي؟</button>
