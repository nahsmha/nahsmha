<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نحسمها | قارن سيارتك</title>
    <style>
        :root { --red: #e50914; --black: #080808; --card: #171717; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Tahoma, Arial, sans-serif; background: #080808; color: #fff; }
        nav { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 7%; border-bottom: 1px solid #252525; background: #000; position: sticky; top: 0; z-index: 3; }
        .logo { font-size: 27px; font-weight: 900; }
        .logo span { color: var(--red); }
        nav a { color: #ddd; text-decoration: none; margin-right: 24px; font-size: 14px; }
        .hero { padding: 60px 20px 40px; text-align: center; background: radial-gradient(circle at center, #30070a 0, #120202 35%, #080808 70%); }
        .badge { display: inline-block; border: 1px solid #5b171b; color: #ff5a61; border-radius: 999px; padding: 8px 14px; margin-bottom: 18px; font-size: 13px; }
        h1 { font-size: 42px; margin: 0 0 14px; }
        .hero h1 span { color: var(--red); }
        .hero p { color: #c7c7c7; font-size: 16px; margin: 0 auto 30px; max-width: 650px; }
        .cta { background: var(--red); border: 0; color: #fff; border-radius: 12px; padding: 15px 28px; font-size: 17px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        main { max-width: 1050px; margin: auto; padding: 28px 18px 70px; }
        .card { background: var(--card); border: 1px solid #292929; border-radius: 20px; padding: 24px; margin-bottom: 20px; box-shadow: 0 12px 30px #000; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        select { width: 100%; padding: 14px; border-radius: 12px; background: #0d0d0d; color: white; border: 1px solid #383838; font-size: 15px; }
        button.full { width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 12px; background: var(--red); color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #2b2b2b; text-align: center; }
        th { color: #aaa; }
        .win { color: #ff5159; font-weight: bold; }
        .result { border: 1px solid #5b171b; background: #210708; padding: 18px; border-radius: 15px; margin-top: 18px; }
        .score { font-size: 30px; text-align: center; font-weight: 900; }
        footer { text-align: center; color: #aaa; padding: 25px; border-top: 1px solid #222; margin-top: 40px; font-size: 15px; }
        @media(max-width:650px){ nav a { display: none; } h1 { font-size: 32px; } .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo">نحسم<span>ها</span> 🔥</div>
        <div>
            <a href="#compare">المقارنة</a>
        </div>
    </nav>

    <section class="hero">
        <div class="badge">🔴 مقارنة سيارات • قرار أوضح</div>
        <h1>محتار بين سيارتين؟<br><span>نحسمها لك.</span></h1>
        <p>قارن المواصفات، اعرف نقاط القوة والاختلاف، وخذ ترشيحًا مبنيًا على احتياجك.</p>
        <a href="#compare" class="cta">ابدأ المقارنة 🚘</a>
    </section>

    <main>
        <section class="card" id="compare">
            <h2>⚡ قارن سيارتين</h2>
            <p style="color:#aaa; font-size:14px;">اختر سيارتين من القائمة الشاملة للبدء في المقارنة.</p>
            <div class="grid">
                <div>
                    <label>السيارة الأولى</label>
                    <select id="a"></select>
                </div>
                <div>
                    <label>السيارة الثانية</label>
                    <select id="b"></select>
                </div>
            </div>
            <button class="full" onclick="compare()">احسمها 🔥</button>
            <div id="result"></div>
        </section>
    </main>

    <footer>
        © 2026 نحسمها — تم التطوير بواسطة المطور يحيى
    </footer>

    <script>
        const cars = {
            "camry": { name: "تويوتا كامري 2026", price: 105000, power: 203, fuel: 16.5, trunk: 428, safety: 9, tech: 8, rel: 10 },
            "corolla": { name: "تويوتا كورولا 2026", price: 78000, power: 139, fuel: 19.8, trunk: 371, safety: 8, tech: 7, rel: 10 },
            "yaris": { name: "تويوتا يارس 2026", price: 63000, power: 105, fuel: 21.7, trunk: 286, safety: 7, tech: 7, rel: 10 },
            "lc300": { name: "تويوتا لاندكروزر 2026", price: 320000, power: 409, fuel: 9.3, trunk: 1131, safety: 10, tech: 9, rel: 10 },
            "prado": { name: "تويوتا برادو 2026", price: 195000, power: 281, fuel: 10.6, trunk: 742, safety: 9, tech: 8, rel: 10 },
            "patrol": { name: "نيسان باترول 2026", price: 290000, power: 425, fuel: 8.2, trunk: 550, safety: 9, tech: 9, rel: 9 },
            "altima": { name: "نيسان ألتيما 2026", price: 100000, power: 188, fuel: 16.8, trunk: 436, safety: 9, tech: 8, rel: 8 },
            "sunny": { name: "نيسان صني 2026", price: 58000, power: 118, fuel: 19.1, trunk: 422, safety: 7, tech: 6, rel: 9 },
            "yukon": { name: "جمس يوكن 2026", price: 255000, power: 355, fuel: 9.8, trunk: 722, safety: 9, tech: 9, rel: 8 },
            "sierra": { name: "جمس سييرا 2026", price: 210000, power: 355, fuel: 8.9, trunk: 1781, safety: 8, tech: 9, rel: 8 },
            "tahoe": { name: "شيفروليه تاهو 2026", price: 245000, power: 355, fuel: 9.8, trunk: 722, safety: 9, tech: 9, rel: 8 },
            "unik": { name: "شانجان UNI-K 2026", price: 140000, power: 233, fuel: 12.6, trunk: 518, safety: 8, tech: 10, rel: 7 },
            "univ": { name: "شانجان UNI-V 2026", price: 88000, power: 185, fuel: 18.1, trunk: 380, safety: 8, tech: 9, rel: 7 }
        };

        function fillSelects() {
            const selA = document.getElementById('a');
            const selB = document.getElementById('b');
            if(!selA || !selB) return;
            
            let opts = '';
            for (let k in cars) {
                opts += `<option value="${k}">${cars[k].name}</option>`;
            }
            selA.innerHTML = opts;
            selB.innerHTML = opts;
            if(selB.options.length > 1) selB.selectedIndex = 1;
        }

        function compare() {
            const k1 = document.getElementById('a').value;
            const k2 = document.getElementById('b').value;
            const c1 = cars[k1];
            const c2 = cars[k2];

            let s1 = 0, s2 = 0;
            const rows = [
                { label: 'السعر (ريال)', val1: c1.price.toLocaleString(), val2: c2.price.toLocaleString(), win: c1.price < c2.price ? 1 : (c1.price > c2.price ? 2 : 0) },
                { label: 'القوة (حصان)', val1: c1.power, val2: c2.power, win: c1.power > c2.power ? 1 : (c1.power < c2.power ? 2 : 0) },
                { label: 'الصرفية (كم/لتر)', val1: c1.fuel, val2: c2.fuel, win: c1.fuel > c2.fuel ? 1 : (c1.fuel < c2.fuel ? 2 : 0) },
                { label: 'الشنطة (لتر)', val1: c1.trunk, val2: c2.trunk, win: c1.trunk > c2.trunk ? 1 : (c1.trunk < c2.trunk ? 2 : 0) },
                { label: 'الأمان', val1: c1.safety + '/10', val2: c2.safety + '/10', win: c1.safety > c2.safety ? 1 : (c1.safety < c2.safety ? 2 : 0) },
                { label: 'التقنيات', val1: c1.tech + '/10', val2: c2.tech + '/10', win: c1.tech > c2.tech ? 1 : (c1.tech < c2.tech ? 2 : 0) },
                { label: 'الاعتمادية', val1: c1.rel + '/10', val2: c2.rel + '/10', win: c1.rel > c2.rel ? 1 : (c1.rel < c2.rel ? 2 : 0) }
            ];

            let html = `<table><tr><th>المعيار</th><th>${c1.name}</th><th>${c2.name}</th></tr>`;
            rows.forEach(r => {
                if(r.win === 1) s1++;
                if(r.win === 2) s2++;
                html += `<tr>
                    <td><b>${r.label}</b></td>
                    <td class="${r.win === 1 ? 'win' : ''}">${r.val1} ${r.win === 1 ? '🏆' : ''}</td>
                    <td class="${r.win === 2 ? 'win' : ''}">${r.val2} ${r.win === 2 ? '🏆' : ''}</td>
                </tr>`;
            });
            html += `</table>`;

            let winnerText = s1 > s2 ? c1.name : (s2 > s1 ? c2.name : 'تعادل بين السيارتين');
            html += `<div class="result">
                <div class="score">${s1} - ${s2}</div>
                <p style="text-align:center; margin:10px 0 0; font-weight:bold; font-size:18px;">🏆 الفائز: ${winnerText}</p>
            </div>`;

            document.getElementById('result').innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', fillSelects);
        fillSelects();
    </script>
</body>
</html>
